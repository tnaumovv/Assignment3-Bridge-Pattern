<polyline points="670,677 590,677 590,425 865,425 865,350" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#triangle)"/>
<text x="813" y="409" text-anchor="middle" font-size="19" fill="#222">implements</text>
<polyline points="670,847 610,847 610,445 975,445 975,350" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#triangle)"/>
<text x="920" y="429" text-anchor="middle" font-size="19" fill="#222">implements</text>
<polyline points="1080,507 1120,507 1120,970 875,970 875,1020" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#open)"/>
<text x="992" y="954" text-anchor="middle" font-size="19" fill="#222">formats status</text>
<polyline points="1080,677 1120,677 1120,970 875,970 875,1020" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#open)"/>
<polyline points="1080,847 1120,847 1120,970 875,970 875,1020" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#open)"/>
<rect x="40" y="770" width="495" height="116" fill="#f8f8f8" stroke="#999" stroke-width="1"/>
<text x="54" y="794" font-size="19">Main creates BasicRemote and QuietRemote,</text>
<text x="54" y="818" font-size="19">and the three concrete device types.</text>
<text x="54" y="842" font-size="19">The shared execute() method is inherited</text>
<text x="54" y="866" font-size="19">by both remote subclasses.</text>
<rect x="40" y="1020" width="560" height="110" fill="#f8f8f8" stroke="#999" stroke-width="1"/>
<text x="54" y="1044" font-size="19">Solid line + hollow triangle: extends</text>
<text x="54" y="1068" font-size="19">Dashed line + hollow triangle: implements</text>
<text x="54" y="1092" font-size="19">Open diamond: has-a Device reference</text>
<text x="54" y="1116" font-size="19">Dashed open arrow: dependency; {readOnly}: final</text>
</g>
