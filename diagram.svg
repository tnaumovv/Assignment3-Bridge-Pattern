<polyline points="430,145 430,175 250,175 250,230" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#open)"/>
<text x="330" y="164" text-anchor="middle" font-size="19" fill="#222">uses</text>
<polyline points="690,145 690,195 875,195 875,245" fill="none" stroke="#222" stroke-width="1.7" stroke-dasharray="8 5" marker-end="url(#open)"/>
<text x="794" y="180" text-anchor="middle" font-size="19" fill="#222">selects implementation</text>
