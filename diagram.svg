<text x="52" y="490" font-size="19">    : void</text>
<text x="52" y="513" font-size="19">+ execute(): String</text>
<rect x="40" y="585" width="230" height="110" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="155.0" y="609" text-anchor="middle" font-size="20">BasicRemote</text>
