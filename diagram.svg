<text x="682" y="858" font-size="19">+ applySettings(poweredOn: boolean,</text>
<text x="682" y="881" font-size="19">    volume: int): String</text>
<rect x="670" y="1020" width="410" height="110" fill="white" stroke="#222" stroke-width="1.6"/>
