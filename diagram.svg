<text x="682" y="688" font-size="19">+ applySettings(poweredOn: boolean,</text>
<text x="682" y="711" font-size="19">    volume: int): String</text>
<rect x="670" y="800" width="410" height="95" fill="white" stroke="#222" stroke-width="1.6"/>
