<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1150" viewBox="0 0 1160 1150">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#222" stroke-width="1.7"/></marker>
<marker id="triangle" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 17 9 L 1 17 Z" fill="white" stroke="#222" stroke-width="1.7"/></marker>
<marker id="diamond" viewBox="0 0 24 16" refX="0" refY="8" markerWidth="24" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 8 L 11 1 L 22 8 L 11 15 Z" fill="white" stroke="#222" stroke-width="1.7"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#111">
